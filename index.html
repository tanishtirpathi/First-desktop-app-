<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis Todo</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto&family=Poppins&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Top Bar -->
    <div id="topbar">
      <div class="top-left-group">
        <span class="app-title">Stark Notes</span>

        <select id="font-selector">
          <option value="'Inter', sans-serif">Inter</option>
          <option value="'Roboto', sans-serif">Roboto</option>
          <option value="'Poppins', sans-serif">Poppins</option>
          <option value="'Courier New', monospace">Courier</option>
          <option value="'Georgia', serif">Georgia</option>
        </select>
      </div>

      <div class="window-controls">
        <button class="control-btn minimize-btn" id="minimize-btn"></button>
        <button class="control-btn maximize-btn" id="maximize-btn"></button>
        <button class="control-btn close-btn" id="close-btn"></button>
      </div>
    </div>

    <!-- Task Editor -->
    <div
      id="task-container"
      contenteditable="true"
      spellcheck="false"
      class="task-editor"
      placeholder="• Write your tasks here..."
    ></div>

    <script src="renderer.js"></script>
  </body>
</html>
